name: Release apps

# main에 푸시할 때마다 Android APK · Windows · macOS 번들을 빌드해 GitHub Release 하나로 발행.
# 태그: vYYMMDDNN (한국시간 날짜 + 같은 날 N번째 = NN 01,02,...)
#
# 웹 배포는 여기 없다 — Vercel Git 연동이 main 푸시를 직접 받는다(이중 배포 금지).
#
# 구조: meta(태그·노트 1회) → android · desktop(병렬) → release(모아서 발행)
# 태그를 meta에서 한 번만 계산하는 게 핵심이다. 빌드 job마다 계산하면 서로 다른 NN이 나온다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 릴리스/태그 생성 권한

# 같은 브랜치에서 연속 푸시 시 진행 중 빌드는 취소(최신만 릴리스)
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 태그 · 릴리스 노트
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 태그 전체를 받아 NN 계산

      - name: Compute tag (vYYMMDDNN)
        id: tag
        run: |
          DATE=$(TZ=Asia/Seoul date +%y%m%d)
          git fetch --tags --force
          LAST=$(git tag -l "v${DATE}??" | sort | tail -n1)
          if [ -z "$LAST" ]; then
            NN=01
          else
            NN=$(printf "%02d" $((10#${LAST: -2} + 1)))
          fi
          TAG="v${DATE}${NN}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### 릴리스 태그: $TAG" >> "$GITHUB_STEP_SUMMARY"

      # 직전 태그~HEAD 커밋을 릴리스 노트로 생성 (직푸시 방식이라 PR 기반 자동노트 대신 커밋 로그 사용)
      - name: Build release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV:+$PREV..HEAD}
          {
            echo "## 변경사항"
            git log $RANGE --no-merges --pretty="- %s (%h)"
            [ -n "$PREV" ] && printf '\n이전 릴리스: %s\n' "$PREV"
            printf '\n---\n\n'
            printf '### 설치\n'
            printf -- '- **Android** — `.apk`. debug 키 서명이라 "출처를 알 수 없는 앱" 허용이 필요하다.\n'
            printf -- '- **Windows** — `.msi` 또는 `.exe`. 코드 서명이 없어 SmartScreen이 막으면 "추가 정보 → 실행".\n'
            printf -- '- **macOS** — `.zip` 안에 `.app`(Intel·Apple Silicon 유니버설). 풀어서 `/Applications`로 옮긴 뒤,\n'
            printf -- '  서명·공증이 없어 Gatekeeper가 막으므로 `xattr -dr com.apple.quarantine "/Applications/STARLITE LANES.app"`\n'
            printf -- '  또는 우클릭 → 열기.\n'
            printf -- '- 설치가 번거로우면 웹에서 바로: https://bowling-3d.vercel.app/\n'
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  # ---------------------------------------------------------------- Android APK
  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 로컬과 동일 · Node 20은 2026-04 EOL
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006"

      # npm ci 대신 install: 락파일이 Mac에서 생성돼 Linux 전용 optional 의존성
      # (@emnapi/* — rolldown WASM 폴백)을 못 담는 npm 크로스플랫폼 버그 우회.
      - run: npm install

      # debug 빌드 = debug 키로 서명되어 바로 설치 가능 (시크릿 불필요).
      # aarch64 단일 = 실기기 대부분 커버 + CI 시간 절약.
      #
      # ⚠️ gen/android의 패키지 경로는 tauri.conf.json > identifier에서 유도된다.
      #    identifier를 바꾸면 gen/android·gen/apple을 같이 옮겨야 이 스텝이 산다(df1510f).
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          npx tauri android build --debug --apk --target aarch64

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "Found APK: $APK"
          cp "$APK" "out/starlite-lanes-${{ needs.meta.outputs.tag }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: out/*

  # ---------------------------------------------------------------- Windows · macOS
  desktop:
    needs: meta
    # 한 플랫폼이 죽어도 나머지는 끝까지 — 릴리스는 성공한 것만 싣는다
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # 기본 타깃(x64). --bundles로 설치본 두 종만 만든다(updater/앱스토어 산출물 제외)
            args: --bundles msi,nsis
            bundle_dir: src-tauri/target/release/bundle
            rust_targets: ""
          - os: macos-latest
            name: macos
            # 유니버설 = Intel + Apple Silicon 한 벌. 타깃 지정 시 산출 경로가 target/<triple>/ 아래로 간다.
            #
            # ⚠️ dmg가 아니라 app이다. dmg 번들러(bundle_dmg.sh)는 Finder를 AppleScript로 조작하는데,
            #    Apple 이벤트 권한이 없는 환경에서 -1743으로 죽는다(로컬에서 실측: .app까지 만들고
            #    "Running AppleScript to make Finder stuff pretty"에서 실패). GUI 세션에 기대는 단계를
            #    릴리스 경로에 두지 않는다 — 서명이 없어 어차피 Gatekeeper 우회가 필요하니 dmg의
            #    드래그-투-Applications 이점도 없다. .app을 ditto로 압축해 올린다.
            args: --target universal-apple-darwin --bundles app
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: npm install

      # 서명 시크릿이 없다 — 서명되지 않은 번들이 나온다(릴리스 노트에 우회법을 적어 둔다).
      # 서명을 붙일 때 필요한 것: Windows는 인증서 + TAURI_SIGNING_*, macOS는 Developer ID +
      # APPLE_CERTIFICATE·APPLE_ID·APPLE_TEAM_ID(공증). 둘 다 유료 계정이 있어야 한다.
      - name: Build desktop bundle
        run: npx tauri build ${{ matrix.args }}

      # productName이 "STARLITE LANES"(공백 포함)라 산출 파일명에 공백·버전이 섞인다.
      # 태그가 붙은 단일 이름으로 정리해 릴리스 자산 이름을 플랫폼 간에 맞춘다.
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          TAG="${{ needs.meta.outputs.tag }}"
          found=0
          for f in "${{ matrix.bundle_dir }}"/*/*; do
            base="$(basename "$f")"
            # .app은 디렉터리다 — ditto로 감싸야 심볼릭 링크·리소스 포크가 보존된다(zip은 깨뜨린다)
            if [ -d "$f" ]; then
              case "$base" in
                *.app)
                  ditto -c -k --keepParent "$f" "out/starlite-lanes-${TAG}-${{ matrix.name }}.zip"
                  found=$((found + 1))
                  ;;
              esac
              continue
            fi
            case "$base" in
              *.msi|*.exe) ;;
              *) continue ;;
            esac
            ext="${f##*.}"
            cp "$f" "out/starlite-lanes-${TAG}-${{ matrix.name }}.${ext}"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::번들을 찾지 못했다 — ${{ matrix.bundle_dir }} 아래를 확인할 것"
            find "${{ matrix.bundle_dir }}" -maxdepth 2 -type f || true
            exit 1
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: out/*

  # ---------------------------------------------------------------- 릴리스 발행
  release:
    needs: [meta, android, desktop]
    # 일부 플랫폼이 실패해도 성공한 것만 실어 발행한다 — 3플랫폼 전원 성공을 요구하면
    # 러너 하나가 흔들릴 때 잘 되던 Android 릴리스까지 같이 죽는다.
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Verify payload
        run: |
          ls -la out || { echo "::error::자산이 하나도 없다 — 전 플랫폼 빌드 실패"; exit 1; }
          [ -n "$(ls -A out)" ] || { echo "::error::자산이 하나도 없다 — 전 플랫폼 빌드 실패"; exit 1; }
          {
            printf '\n### 이번 릴리스에 실린 것\n'
            for f in out/*; do printf -- '- `%s`\n' "$(basename "$f")"; done
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
